<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>⟡ Cognifile AI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <!--
        BACKGROUND
        Kept simple so the existing JavaScript does not
        lose any expected page elements.
    -->

    <div class="background">

        <!-- Soft background glow -->
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>

        <!-- Central glass orb -->
        <div class="orb-container">

            <div class="orb-glow"></div>

            <div class="orb">

                <div class="orb-highlight"></div>

                <div class="orb-core"></div>

            </div>

        </div>

    </div>


    <!--
        Hidden particle container.
        Kept for compatibility with existing JavaScript.
        It will not be visually displayed unless CSS/JS
        explicitly makes it visible.
    -->

    <div
        id="particles"
        aria-hidden="true"
    ></div>


    <!--
        MAIN APPLICATION
    -->

    <div class="chat-container">


        <!-- =========================
             HEADER
        ========================== -->

        <div class="header">

            <h1>
                ⟡ Cognifile AI
            </h1>

            <p>
                Multimodal AI Assistant
            </p>

            <div class="status">
                ● Online
            </div>

            <div id="modeIndicator">
                Current Mode:
                <b>Normal</b>
            </div>

        </div>


        <!-- =========================
             MODES
        ========================== -->

        <div class="prompt-bar">

            <button
                type="button"
                class="prompt-btn"
                onclick="setMode('normal')"
            >
                🧠 Normal
            </button>


            <button
                type="button"
                class="prompt-btn"
                onclick="setMode('interview')"
            >
                🎯 Interview
            </button>


            <button
                type="button"
                class="prompt-btn"
                onclick="setMode('resume')"
            >
                📝 Resume
            </button>

        </div>


        <!-- =========================
             CHAT
        ========================== -->

        <div
            class="chat-box"
            id="chatBox"
        >

            <div class="bot-message">

                ✦ Welcome to Cognifile AI.

                <br><br>

                Ask me anything, upload a PDF or
                image, or ask me to create an image.

            </div>

        </div>


        <!-- =========================
             FILE PREVIEW
        ========================== -->

        <div
            id="filePreview"
            style="
                display: none;
                padding: 0 20px 10px;
                font-size: 13px;
            "
        >
        </div>


        <!-- =========================
             INPUT AREA
        ========================== -->

        <div class="input-area">


            <!-- PDF / FILE -->

            <button
                type="button"
                title="Add PDF or image"
                onclick="
                    document
                    .getElementById('fileInput')
                    .click()
                "
            >
                📎
            </button>


            <input
                type="file"
                id="fileInput"
                multiple
                accept="
                    .pdf,
                    .png,
                    .jpg,
                    .jpeg,
                    .webp
                "
                style="display: none;"
            >


            <!-- IMAGE -->

            <button
                type="button"
                title="Add image"
                onclick="
                    document
                    .getElementById('imageInput')
                    .click()
                "
            >
                🖼️
            </button>


            <input
                type="file"
                id="imageInput"
                multiple
                accept="
                    image/png,
                    image/jpeg,
                    image/webp
                "
                style="display: none;"
            >


            <!-- TEXT INPUT -->

            <input
                type="text"
                id="userInput"
                placeholder="Ask Cognifile AI anything..."
                autocomplete="off"
                onkeypress="handleKey(event)"
            >


            <!-- SEND -->

            <button
                type="button"
                onclick="sendMessage()"
            >
                Send ✨
            </button>


        </div>


    </div>


    <!--
        EXISTING JAVASCRIPT
        Keep this exactly as your current project uses it.
    -->

    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
